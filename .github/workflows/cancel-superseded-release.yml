name: Cancel superseded release
on:
  push:
    branches: [master]
    paths: [.github/workflows/cancel-superseded-release.yml]
permissions:
  actions: write
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel the release withdrawal revoked by the user
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/36693337135/cancel"
