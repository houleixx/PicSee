name: Build DMG Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example 0.2.1
        required: true
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dmg_name=PicSee-$VERSION.dmg" >> "$GITHUB_OUTPUT"

      - name: Make scripts executable
        run: chmod +x Scripts/build-app.sh Scripts/build-dmg.sh

      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          CODESIGN_IDENTITY="$(
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
              | awk 'NR == 1 { print $2 }'
          )"
          if [ -z "$CODESIGN_IDENTITY" ]; then
            echo "No valid codesigning identity found in imported keychain" >&2
            exit 1
          fi
          echo "PICSEE_CODESIGN_IDENTITY=$CODESIGN_IDENTITY" >> "$GITHUB_ENV"

      - name: Build DMG
        run: |
          PICSEE_VERSION="${{ steps.version.outputs.version }}" \
          PICSEE_BUILD_NUMBER="${{ github.run_number }}" \
          PICSEE_SKIP_LOCAL_INSTALL=1 \
          PICSEE_CODESIGN_IDENTITY="$PICSEE_CODESIGN_IDENTITY" \
          Scripts/build-dmg.sh

      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -o pipefail

          for name in APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name secret is empty"
              exit 1
            fi
          done

          DMG_PATH="build/dmg/${{ steps.version.outputs.dmg_name }}"
          NOTARY_OUTPUT="$RUNNER_TEMP/notarytool-submit.json"

          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait \
            --timeout 30m \
            --output-format json | tee "$NOTARY_OUTPUT"

          xcrun stapler staple "$DMG_PATH"
          spctl --assess --type open --verbose=4 "$DMG_PATH"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.dmg_name }}
          path: build/dmg/${{ steps.version.outputs.dmg_name }}

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/dmg/${{ steps.version.outputs.dmg_name }}
          generate_release_notes: true
